<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pergunta 3</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body data-requires-player="true">
    <div class="progress-container">
      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
      <span class="progress-percent">0%</span>
    </div>

    <div
      id="space"
      style="background-image: url(&quot;./img/Background2.gif&quot;)"
    ></div>

    <main class="question-layout">
      <img src="./img/Quiz (4).gif" class="spaceship" alt="Nave espacial" />

      <section class="question-box" aria-labelledby="questionTitle">
        <p class="question-counter">Pergunta 3/10</p>
        <h1 id="questionTitle" class="question-title">
          Sua cidade perdeu energia el&eacute;trica.
        </h1>

        <button class="option" type="button" onclick="select(0, true)">
          Preparar suprimentos
        </button>
        <button class="option" type="button" onclick="select(1, false)">
          Esperar sem agir
        </button>
        <button class="option" type="button" onclick="select(2, false)">
          Entrar em desespero
        </button>
      </section>
    </main>

    <script src="js/quiz.js"></script>
    <script src="js/animeEffects.js"></script>
    <script>
      renderProgress();

      function select(selected, correct) {
        answerQuestion(3, selected, correct);
        nextQuestion("q4.html");
      }
    </script>
  </body>
</html>
