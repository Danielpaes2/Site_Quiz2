<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pergunta 8</title>

    <link rel="stylesheet" href="css/style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  </head>

  <body>
    <div class="progress-container">
      <div class="progress-track">
        <div id="progressBar"></div>
      </div>
      <span class="progress-percent">0%</span>
    </div>

    <div id="space" style="background-image: url('img/Background.png');"></div>

    <div class="question-layout">
      <div>
        <img src="./img/spaceship.gif" class="spaceship" />
      </div>

      <div class="question-box">
        <h1 class="question-title">Você intercepta uma mensagem alienígena.</h1>

        <button class="option" onclick="select(0, true)">
          Traduzir cuidadosamente
        </button>

        <button class="option" onclick="select(1, false)">
          Apagar imediatamente
        </button>

        <button class="option" onclick="select(2, false)">
          Responder sem entender
        </button>
      </div>
    </div>

    <script src="js/quiz.js"></script>
    <script src="js/animeEffects.js"></script>

    <script>
      renderProgress();

      function select(selected, correct) {
        answerQuestion(8, selected, correct);

        nextQuestion("q9.html");
      }
    </script>
  </body>
</html>
