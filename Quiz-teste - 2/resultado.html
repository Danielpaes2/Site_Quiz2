<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultado</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="game-result" data-requires-player="true">
    <div
      id="space"
      style="background-image: url(&quot;./img/Background2.gif&quot;)"
    ></div>

    <main class="result-screen">
      <section class="result-card" aria-labelledby="resultTitle">
        <p class="eyebrow">Tela final de jogo</p>
        <h1 id="resultTitle" class="result-title">
          Relatorio de Sobrevivencia
        </h1>

        <h2 id="scoreText"></h2>

        <div class="result-grid">
          <div
            class="result-stats rpg-character-card"
            aria-label="Ficha do sobrevivente"
          >
            <div class="stat-card stat-rank">
              <span>Perfil dominante</span>
              <strong id="survivalRank"></strong>
            </div>
            <div class="rpg-avatar" id="profileIcon" aria-hidden="true">?</div>
            <div class="rpg-traits" id="profileTraits"></div>
          </div>

          <div class="chart-panel rpg-score-panel">
            <p class="panel-title">Pontuacao visual</p>
            <div
              id="resultChart"
              class="rpg-bars"
              aria-label="Grafico de perfis"
            ></div>
          </div>
        </div>

        <div class="radar-panel">
          <p class="panel-title">Radar RPG</p>
          <div class="chartjs-frame" aria-label="Grafico RPG complementar">
            <canvas id="profileChart"></canvas>
          </div>
        </div>

        <p id="resultMessage" class="result-message"></p>

        <button type="button" onclick="restartQuiz()">TRY AGAIN</button>
      </section>
    </main>

    <script src="js/quiz.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/result.js"></script>
  </body>
</html>
